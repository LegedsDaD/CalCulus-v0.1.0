name: Auto Build and Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools pybind11 twine

    - name: Detect project directory
      id: detect
      run: |
        echo "Searching for pyproject.toml or setup.py..."
        DIR=$(dirname $(find . -type f \( -name "pyproject.toml" -o -name "setup.py" \) | head -n 1))
        echo "Project directory detected: $DIR"
        echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

    - name: Show detected directory contents
      run: |
        echo "Detected directory: $PROJECT_DIR"
        ls -R $PROJECT_DIR

    - name: Build package
      run: |
        cd "$PROJECT_DIR"
        python -m build

    - name: Publish to PyPI
      run: |
        cd "$PROJECT_DIR"
        twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
